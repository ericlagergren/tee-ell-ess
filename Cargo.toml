[package]
name = "tee-ell-ess"
version = "0.1.1"
description = """
TLS 1.3
"""
edition = "2021"
license = "BSD-3-Clause"
readme = "README.md"
documentation = "https://docs.rs/tee-ell-ess"
repository = "https://github.com/ericlagergren/tee-ell-ess"
keywords = ["tls", "tls-1.3", "networking"]
categories = ["cryptography", "no-std", "no-std::no-alloc"]

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
alloc_instead_of_core = "warn"
arithmetic_side_effects = "warn"
cast_lossless = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
expect_used = "warn"
implicit_saturating_sub = "warn"
indexing_slicing = "warn"
missing_panics_doc = "warn"
panic = "warn"
ptr_as_ptr = "warn"
string_slice = "warn"
transmute_ptr_to_ptr = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"

[features]
default = []

# Enable `alloc` support.
alloc = [
	"buggy/alloc",
	"zeroize/alloc",
]

debug = ["std"]

# Experimental features NOT covered by semver.
experimental = []

# Enable `std` support.
std = [
	"alloc",

	"bitflags/std",
	"buggy/std",
	"thiserror/std",
	"zeroize/std",
]

tls12 = []

[dependencies]
bitflags = { version = "2", default-features = false }
buggy = { version = "0.1", default-features = false }
cfg-if = { version = "1", default-features = false }
subtle = { version = "2.6", default-features = false, features = ["core_hint_black_box"] }
zeroize = { version = "1.8", default-features = false }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
tee-ell-ess = { path = ".", features = ["experimental"] }

# hex = { version = "0.4", features = ["serde"] }
hex-literal = { version = "0.4" }
# criterion = { version = "0.5" }
# rand = { version = "0.8", features = ["std_rng"] }
# serde_json = { version = "1" }
# serde = { version = "1", default-features = false, features = ["derive"] }

# [[bench]]
# name = "lib"
# harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-all-features]
always_include_features = []
